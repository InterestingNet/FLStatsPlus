name: Build

# Every push builds the plugin and uploads it as an artifact (Actions tab).
# To publish a version: Actions -> Build -> "Run workflow", enter a version (e.g. 0.1.0).
# That builds it, creates the GitHub Release + tag v<version> with latest.zip, and updates
# repo.json (the Dalamud custom-repository file people add in /xlsettings).
# Pushing a v* tag does the same.

on:
  push:
    branches: [main, master, ui-test]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish as a release, e.g. 0.1.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $rel = "${{ inputs.release_version }}"
          if ($rel) { $v = $rel.TrimStart('v') }
          elseif ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "0.0.0.${{ github.run_number }}" }
          $parts = @($v.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $v = ($parts[0..3] -join '.')
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Build
        run: dotnet build FLStatsPlus.sln -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Collect plugin zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path PvpStats/bin -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "latest.zip not found - check the build output" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $zip.FullName out/latest.zip
          Write-Host "Packaged $($zip.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'ui-test' && 'FLStatsPlusTest' || 'FLStatsPlus' }}
          path: out/latest.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: FLStatsPlus
          path: out

      - name: Work out tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then echo "tag=v${{ inputs.release_version }}" | sed 's/vv/v/' >> "$GITHUB_OUTPUT"
          else echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" out/latest.zip --target "${{ github.sha }}" \
            --title "FLStats Plus ${{ steps.tag.outputs.tag }}" --generate-notes

      - name: Update repo.json (Dalamud custom repository)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 tools/make_repo_json.py PvpStats/FLStatsPlus.json repo.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "repo.json: ${TAG}" || echo "repo.json unchanged"
          git push
